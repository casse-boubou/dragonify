services:
  dragonify:
    image: ghcr.io/casse-boubou/dragonify:main
    environment:
      CONNECT_ALL: false
      LOG_LEVEL: debug
    restart: unless-stopped
    user: 0:${DOCKER_GID:-0}
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp:/app/logs
