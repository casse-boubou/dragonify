services:
  dragonify:
    container_name: dragonify
    image: ghcr.io/casse-boubou/dragonify:v1.3.1@sha256:b2278d5fb1f57b49ba47f416fe938d33b7f4e1a157827b95d145bd83802271a0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - TZ=Etc/UTC
      - LOG_LEVEL=info
      - CONNECT_ALL=false
      - CUSTOMS_NETWORKS=ix-dragonify_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro