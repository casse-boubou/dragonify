services:
  dragonify:
    container_name: dragonify
    image: ghcr.io/casse-boubou/dragonify:v1.3.2@sha256:0520d6bd7e9c6d03c4ddf8df645d01e982072d18f2b21170fe708158d87ad494
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - TZ=Etc/UTC
      - LOG_LEVEL=info
      - CONNECT_ALL=false
      - CUSTOMS_NETWORKS=ix-dragonify_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro